  <style>
    :root {
      --primary-color: #a237be;
      --text-main: #212121;
      --bg-page: #ffffff;
      --bg-section: #f7f7f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Navigation */
    header {
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #e0e0e0;
    }

    .nav-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      min-height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #1f1f1f;
    }

    .brand img {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand span {
      font-family: 'Oswald', sans-serif;
      font-size: 20pt;
      letter-spacing: 0.5px;
      font-weight: 500;
      text-transform: uppercase;
      color: #1f1f1f;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      font-family: 'Open Sans', sans-serif;
      font-size: 12pt;
      font-weight: 400;
      color: #1f1f1f;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 4px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    nav a:hover {
      background-color: rgba(31, 31, 31, 0.08);
    }

    nav a.active {
      background-color: #1f1f1f;
      color: #ffffff;
      font-weight: 600;
    }

    /* Page Header */
    .page-header {
      padding: 50px 20px 30px;
      text-align: center;
      background-color: #ffffff;
    }

    .page-header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 44pt;
      font-weight: 400;
      text-transform: uppercase;
      color: #1f1f1f;
      letter-spacing: 1px;
    }

    /* Posters Grid matching Google Sites 2-column layout */
    .posters-container {
      max-width: 1050px;
      margin: 0 auto 60px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .poster-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
      align-items: center;
    }

    .poster-card {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      background: #fdfdfd;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .poster-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .poster-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      background-color: #ffffff;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      padding: 24px 20px;
      font-size: 11pt;
      color: #777;
    }

    @media (max-width: 768px) {
      .page-header h1 { font-size: 32pt; }
      .nav-wrapper { flex-direction: column; gap: 12px; }
      nav { justify-content: center; gap: 4px; }
      nav a { font-size: 10.5pt; padding: 6px 10px; }
      .poster-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
